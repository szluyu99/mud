# Build the driver first:  docker build -t fluffos-mud -f docker/Dockerfile docker
# Start all games:  docker compose up -d
# Start one game:   docker compose up -d zjmud
# Data written by the games (player saves, logs) goes into games/<name>/mudlib/{data,log}.
x-mud: &mud
  image: fluffos-mud:latest
  restart: unless-stopped
  user: "${UID:-1000}:${GID:-1000}"

services:
  jy:
    <<: *mud
    command: /mudlib/config.jy
    ports: ["4000:4000", "8081:8081"]
    volumes: ["./games/jy/mudlib:/mudlib", "./games/jy/www:/fluffos/www:ro"]

  es2:
    <<: *mud
    command: /mudlib/config.es2
    ports: ["4100:4100", "8082:8082"]
    volumes: ["./games/es2/mudlib:/mudlib", "./games/es2/www:/fluffos/www:ro"]

  xyj:
    <<: *mud
    command: /mudlib/config.xyj
    ports: ["8084:5555", "8083:8083"]
    volumes: ["./games/xyj/mudlib:/mudlib", "./games/xyj/www:/fluffos/www:ro"]

  zjmud:
    <<: *mud
    command: /mudlib/config.zj
    ports: ["8086:3000", "8085:8085"]
    volumes: ["./games/zjmud/mudlib:/mudlib", "./games/zjmud/www:/fluffos/www:ro"]

  zjmudhell:
    <<: *mud
    command: /mudlib/config.zj
    ports: ["8088:40204", "8087:8087"]
    volumes: ["./games/zjmudhell/mudlib:/mudlib", "./games/zjmudhell/www:/fluffos/www:ro"]

  zjdyzj:
    <<: *mud
    command: /mudlib/config.zj
    ports: ["8090:40074", "8089:8089"]
    volumes: ["./games/zjdyzj/mudlib:/mudlib", "./games/zjdyzj/www:/fluffos/www:ro"]

  shujian3:
    <<: *mud
    command: /mudlib/config.zj
    ports: ["8092:40200", "8091:8091"]
    volumes: ["./games/shujian3/mudlib:/mudlib", "./games/shujian3/www:/fluffos/www:ro"]

  dtxyzjb:
    <<: *mud
    command: /mudlib/config.zj
    ports: ["8094:40267", "8093:8093"]
    volumes: ["./games/dtxyzjb/mudlib:/mudlib", "./games/dtxyzjb/www:/fluffos/www:ro"]
